<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download SIM - eSIM Store</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #10b981;
      --bg: #f8fafc;
      --card: #fff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --header-bg: #ffffff;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      padding-top: 140px; /* Space for fixed header */
    }
    
    .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
    
    /* Fixed Header Section */
    .fixed-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: var(--header-bg);
      box-shadow: var(--shadow);
      z-index: 1000;
      padding: 12px 20px;
    }
    
    .header-content {
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .brand {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
    }
    
    .search-row { 
      display: flex; 
      gap: 12px; 
      align-items: flex-end; 
      flex-wrap: wrap; 
    }
    
    .filter-row { 
      display: flex; 
      gap: 16px; 
      align-items: center; 
      flex-wrap: wrap; 
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    
    .range-group { display: flex; align-items: center; gap: 6px; }
    
    input, select, button { 
      padding: 8px 12px; 
      border: 1px solid var(--border); 
      border-radius: 6px; 
      font-size: 0.9rem; 
      transition: all 0.2s;
    }
    
    input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    
    button { 
      background: var(--primary); 
      color: #fff; 
      border: none; 
      cursor: pointer; 
      font-weight: 600; 
      transition: all 0.2s;
    }
    
    button:hover { background: var(--primary-dark); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button.secondary { background: var(--muted); }
    button.success { background: var(--success); }
    
    /* Country Selector */
    .country-selector { position: relative; min-width: 280px; }
    .selector-display { 
      background: #fff; 
      border: 1px solid var(--border); 
      padding: 8px 12px; 
      border-radius: 6px; 
      cursor: pointer; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      min-width: 280px;
    }
    .selector-display:hover { border-color: var(--primary); }
    
    .selector-dropdown { 
      position: absolute; 
      top: 100%; 
      left: 0; 
      right: 0; 
      background: #fff; 
      border: 1px solid var(--border); 
      border-radius: 6px; 
      margin-top: 4px; 
      max-height: 300px; 
      overflow-y: auto; 
      z-index: 1001; 
      box-shadow: var(--shadow); 
      display: none; 
    }
    
    .selector-dropdown input { 
      width: 100%; 
      border: none; 
      border-bottom: 1px solid var(--border); 
      border-radius: 0; 
      outline: none; 
      padding: 10px 12px;
    }
    
    .country-list { max-height: 250px; overflow-y: auto; }
    .country-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; }
    .country-item:hover { background: #f1f5f9; }
    .country-item input { width: auto; margin: 0; }
    
    /* Plan Type Checkboxes */
    .plan-type-group {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }
    
    .checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    
    /* Results Area */
    .results-section { padding: 20px 0 40px; }
    
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    
    .empty-state h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--text);
    }
    
    .empty-state p {
      font-size: 1rem;
    }
    
    .state { text-align: center; padding: 60px 20px; color: var(--muted); }
    
    .loader { 
      border: 3px solid var(--border); 
      border-top-color: var(--primary); 
      border-radius: 50%; 
      width: 40px; 
      height: 40px; 
      animation: spin 1s linear infinite; 
      margin: 0 auto 16px; 
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .product-card {
      background: var(--card);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      overflow: hidden;
      transition: all 0.2s;
      border: 1px solid var(--border);
    }
    
    .product-card:hover {
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }
    
    .product-header {
      padding: 16px;
      background: linear-gradient(135deg, #f8fafc 0%, #fff 100%);
      border-bottom: 1px solid var(--border);
    }
    
    .product-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    
    .product-price {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }
    
    .product-body {
      padding: 16px;
    }
    
    .product-specs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .spec-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .spec-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .spec-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }
    
    .product-actions {
      display: flex;
      gap: 8px;
      padding: 16px;
      border-top: 1px solid var(--border);
      background: #f8fafc;
    }
    
    .product-actions button {
      flex: 1;
      padding: 10px;
      font-size: 0.9rem;
    }
    
    .compare-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: #f8fafc;
      border-top: 1px solid var(--border);
    }
    
    .compare-checkbox label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }
    
    /* More Info Expandable */
    .more-info-section {
      display: none;
      padding: 16px;
      background: #f8fafc;
      border-top: 1px solid var(--border);
    }
    
    .more-info-section.expanded {
      display: block;
    }
    
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .coverage-section {
      margin-top: 16px;
    }
    
    .coverage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 8px 0;
      font-weight: 600;
    }
    
    .coverage-count {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: normal;
    }
    
    .coverage-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      max-height: 300px;
      overflow-y: auto;
    }
    
    .coverage-item {
      background: #fff;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .coverage-item:hover {
      border-color: var(--primary);
      background: #eff6ff;
    }
    
    /* Operator Popup */
    .operator-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      z-index: 2000;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      display: none;
    }
    
    .operator-popup.active {
      display: block;
    }
    
    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    
    .popup-title {
      font-size: 1.1rem;
      font-weight: 700;
    }
    
    .popup-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
    }
    
    .popup-close:hover {
      color: var(--text);
    }
    
    .popup-body {
      padding: 20px;
    }
    
    .operator-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .operator-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
    }
    
    .operator-name {
      font-weight: 600;
    }
    
    .operator-type {
      font-size: 0.85rem;
      color: var(--muted);
      background: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1999;
      display: none;
    }
    
    .popup-overlay.active {
      display: block;
    }
    
    /* Comparison Table */
    .comparison-section {
      background: var(--card);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 30px;
      overflow-x: auto;
    }
    
    .comparison-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    
    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }
    
    .comparison-table th,
    .comparison-table td {
      padding: 12px;
      text-align: left;
      border: 1px solid var(--border);
      font-size: 0.9rem;
    }
    
    .comparison-table th {
      background: #f8fafc;
      font-weight: 600;
      color: var(--muted);
      min-width: 150px;
    }
    
    .comparison-table tr:nth-child(even) {
      background: #f8fafc;
    }
    
    /* Badge Styles */
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .badge-global {
      background: #dbeafe;
      color: #1e40af;
    }
    
    .badge-regional {
      background: #fef3c7;
      color: #92400e;
    }
    
    .badge-local {
      background: #d1fae5;
      color: #065f46;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      body { padding-top: 180px; }
      .fixed-header { padding: 12px; }
      .product-grid { grid-template-columns: 1fr; }
      .search-row { flex-direction: column; align-items: stretch; }
      .filter-row { flex-direction: column; align-items: stretch; }
      .country-selector { min-width: 100%; }
      .selector-display { min-width: 100%; }
      .plan-type-group { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <!-- Fixed Header -->
  <div class="fixed-header">
    <div class="header-content">
      <div class="brand">📱 Download SIM</div>
      
      <div class="search-row">
        <div class="field country-selector" id="countrySelector">
          <label>Travel Destinations</label>
          <div class="selector-display" id="selectorDisplay" onclick="toggleDropdown()">
            <span>Select countries...</span>
            <span>▼</span>
          </div>
          <div class="selector-dropdown" id="selectorDropdown">
            <input type="text" id="countrySearch" placeholder="Search countries..." oninput="filterCountries()" />
            <div class="country-list" id="countryList"></div>
          </div>
        </div>
        
        <div class="field" style="justify-content: flex-end;">
          <button id="findPlansBtn" style="padding: 8px 24px;">🔍 Find Plans</button>
        </div>
      </div>
      
      <div class="filter-row">
        <div class="field">
          <label>Data (GB)</label>
          <div class="range-group">
            <input type="number" id="minData" placeholder="Min" step="0.1" min="0" style="width: 80px;">
            <span>to</span>
            <input type="number" id="maxData" placeholder="Max" step="0.1" min="0" style="width: 80px;">
          </div>
        </div>
        
        <div class="field">
          <label>Duration (Days)</label>
          <div class="range-group">
            <select id="minDuration" style="width: 80px;">
              <option value="">Min</option>
              <option>1</option><option>3</option><option>5</option><option>7</option>
              <option>10</option><option>14</option><option>28</option><option>60</option>
              <option>90</option><option>180</option><option>365</option>
            </select>
            <span>to</span>
            <select id="maxDuration" style="width: 80px;">
              <option value="">Max</option>
              <option>1</option><option>3</option><option>5</option><option>7</option>
              <option>10</option><option>14</option><option>28</option><option>60</option>
              <option>90</option><option>180</option><option>365</option>
            </select>
          </div>
        </div>
        
        <div class="field">
          <label>Plan Type</label>
          <div class="plan-type-group">
            <label class="checkbox-label">
              <input type="checkbox" id="globalInclude" onchange="handlePlanTypeChange('globalInclude')">
              Include Global
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="globalExclude" onchange="handlePlanTypeChange('globalExclude')">
              Exclude Global
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="regionalInclude" onchange="handlePlanTypeChange('regionalInclude')">
              Include Regional
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="regionalExclude" onchange="handlePlanTypeChange('regionalExclude')">
              Exclude Regional
            </label>
          </div>
        </div>
        
        <div class="field" style="justify-content: flex-end; margin-left: auto;">
          <button class="secondary" id="applyFiltersBtn" style="padding: 8px 16px;">Apply Filters</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    <!-- Empty State (shown initially) -->
    <div id="emptyState" class="empty-state">
      <h2>🌍 Please select your travel destinations</h2>
      <p>Choose one or more countries above and click "Find Plans" to see available eSIM options.</p>
    </div>
    
    <!-- Results Section -->
    <div id="resultsSection" class="results-section" style="display: none;">
      <!-- Comparison Section (shown when 2+ products selected) -->
      <div id="comparisonSection" class="comparison-section" style="display: none;">
        <div class="comparison-header">
          <h3>📊 Comparing <span id="compareCount">0</span> Products</h3>
          <button class="secondary" onclick="clearComparison()">Clear Comparison</button>
        </div>
        <div id="comparisonTableContainer"></div>
      </div>
      
      <!-- Loading State -->
      <div id="loadingState" class="state" style="display: none;">
        <div class="loader"></div>
        <p>Searching for plans...</p>
      </div>
      
      <!-- Error State -->
      <div id="errorState" class="state" style="display: none;"></div>
      
      <!-- No Results State -->
      <div id="noResultsState" class="state" style="display: none;">
        <p>⚠️ No plans found matching your criteria.</p>
      </div>
      
      <!-- Product Grid -->
      <div id="productGrid" class="product-grid"></div>
    </div>
  </div>

  <!-- Operator Popup -->
  <div class="popup-overlay" id="popupOverlay" onclick="closeOperatorPopup()"></div>
  <div class="operator-popup" id="operatorPopup">
    <div class="popup-header">
      <div class="popup-title" id="popupCountryName">Country Operators</div>
      <button class="popup-close" onclick="closeOperatorPopup()">×</button>
    </div>
    <div class="popup-body">
      <div class="operator-list" id="operatorList"></div>
    </div>
  </div>

  <script>
    // Configuration - Google Sheets Data Source
    const SHEET_ID = '1D6zQ91MYfbQL4XSClSWffSTOfmDFJoO4hEdpENB0_RY';
    const COUNTRIES_SHEET = 'AppsScript_Countries';
    const PRODUCTS_SHEET = 'FRONTEND_Products';
    
    const COUNTRIES_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${COUNTRIES_SHEET}`;
    const PRODUCTS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${PRODUCTS_SHEET}`;

    // State
    let selectedCountries = [];
    let allProducts = [];
    let allCountries = [];
    let filteredPlans = [];
    let comparedProducts = [];

    // CSV Parsing helper functions
    function parseCSVLine(line) {
      const result = [];
      let inQuote = false;
      let current = '';
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') inQuote = !inQuote;
        else if (ch === ',' && !inQuote) {
          result.push(current.trim());
          current = '';
        } else current += ch;
      }
      result.push(current.trim());
      return result;
    }

    function stripQuotes(str) { return str ? str.replace(/^"|"$/g, '') : ''; }

    // Load data from Google Sheets
    async function loadData() {
      const display = document.getElementById('selectorDisplay');
      const firstSpan = display ? display.querySelector('span:first-child') : null;
      if (firstSpan) firstSpan.textContent = 'Loading countries...';

      try {
        // Fetch countries list
        const countriesResponse = await fetch(COUNTRIES_URL);
        if (!countriesResponse.ok) throw new Error(`HTTP ${countriesResponse.status} for countries`);
        const countriesText = await countriesResponse.text();
        const countriesLines = countriesText.split(/\r?\n/).filter(l => l.trim().length > 0);
        
        if (countriesLines.length < 2) throw new Error('No country data rows');
        
        const countriesHeaders = parseCSVLine(countriesLines[0]);
        const countryNameIdx = countriesHeaders.findIndex(h => h.toLowerCase().includes('name') || h.toLowerCase().includes('country'));
        
        if (countryNameIdx === -1) throw new Error('Country name column not found');
        
        const countrySet = new Set();
        for (let i = 1; i < countriesLines.length; i++) {
          const row = parseCSVLine(countriesLines[i]);
          if (row.length <= countryNameIdx) continue;
          const countryName = stripQuotes(row[countryNameIdx]).trim();
          if (countryName) countrySet.add(countryName);
        }
        
        allCountries = Array.from(countrySet).sort();
        
        // Fetch products list
        const productsResponse = await fetch(PRODUCTS_URL);
        if (!productsResponse.ok) throw new Error(`HTTP ${productsResponse.status} for products`);
        const productsText = await productsResponse.text();
        const productsLines = productsText.split(/\r?\n/).filter(l => l.trim().length > 0);
        
        if (productsLines.length < 2) throw new Error('No product data rows');
        
        const productsHeaders = parseCSVLine(productsLines[0]);
        const priceIdx = productsHeaders.findIndex(h => h === 'DSIM Price');
        const nameIdx = productsHeaders.findIndex(h => h === 'API name');
        const locationIdx = productsHeaders.findIndex(h => h === 'API locationName');
        const volumeIdx = productsHeaders.findIndex(h => h === 'CSV GBs_Binary');
        const durationIdx = productsHeaders.findIndex(h => h === 'API duration');
        const packageCodeIdx = productsHeaders.findIndex(h => h === 'API packageCode');
        const operatorsIdx = productsHeaders.findIndex(h => h === 'CSV Operators');
        const countryCodesIdx = productsHeaders.findIndex(h => h === 'CSV Country Codes');
        const activeTypeIdx = productsHeaders.findIndex(h => h === 'API activeType');
        const ipExportIdx = productsHeaders.findIndex(h => h === 'API ipExport');
        const smsStatusIdx = productsHeaders.findIndex(h => h === 'API smsStatus');
        const topUpIdx = productsHeaders.findIndex(h => h === 'API suppotTopUpType');

        if (priceIdx === -1 || nameIdx === -1 || locationIdx === -1)
          throw new Error('Required columns not found in products');

        const products = [];

        for (let i = 1; i < productsLines.length; i++) {
          const row = parseCSVLine(productsLines[i]);
          if (row.length <= Math.max(priceIdx, nameIdx, locationIdx)) continue;
          const locationRaw = row[locationIdx] || '';
          if (!locationRaw.trim()) continue;

          const countries = locationRaw.split(',').map(c => stripQuotes(c.trim())).filter(c => c);
          if (!countries.length) continue;

          let price = row[priceIdx];
          if (price && !price.startsWith('$') && !isNaN(parseFloat(price)))
            price = '$' + parseFloat(price).toFixed(2);

          products.push({
            name: row[nameIdx] || 'Unnamed',
            price: price || 'N/A',
            volume: (volumeIdx !== -1 && row[volumeIdx]) ? row[volumeIdx] : '—',
            duration: (durationIdx !== -1 && row[durationIdx]) ? row[durationIdx] : '—',
            packageCode: (packageCodeIdx !== -1 && row[packageCodeIdx]) ? row[packageCodeIdx] : '',
            countries: countries,
            operators: (operatorsIdx !== -1) ? row[operatorsIdx] : '',
            countryCodes: (countryCodesIdx !== -1) ? row[countryCodesIdx] : '',
            activeType: (activeTypeIdx !== -1) ? row[activeTypeIdx] : '',
            ipExport: (ipExportIdx !== -1) ? row[ipExportIdx] : '',
            smsStatus: (smsStatusIdx !== -1) ? row[smsStatusIdx] : '',
            supportTopUp: (topUpIdx !== -1) ? row[topUpIdx] : ''
          });
        }

        allProducts = products;

        // Render country list
        renderCountryList(allCountries);
        if (firstSpan) firstSpan.textContent = 'Select countries...';

      } catch (err) {
        console.error('❌ Failed to load data:', err);
        if (firstSpan) firstSpan.textContent = 'Failed to load';
        // Fallback
        const fallback = [
          'Japan', 'South Korea', 'USA', 'UK', 'France', 'Germany', 'Italy',
          'Spain', 'Australia', 'Canada', 'China', 'Thailand', 'Singapore',
          'Malaysia', 'Indonesia', 'Vietnam', 'Philippines', 'India', 'UAE',
          'Turkey', 'Brazil', 'Mexico', 'Argentina', 'South Africa', 'Egypt'
        ];
        allCountries = fallback;
        renderCountryList(allCountries);
      }
    }

    function renderCountryList(countries) {
      const list = document.getElementById('countryList');
      if (!list) return;
      list.innerHTML = countries.map(c => `
        <label class="country-item">
          <input type="checkbox" value="${c}" onchange="updateSelection()"> ${c}
        </label>
      `).join('');
    }

    function setupEventListeners() {
      document.getElementById('findPlansBtn').addEventListener('click', findPlans);
      document.getElementById('applyFiltersBtn').addEventListener('click', applyFilters);

      // Close dropdown when clicking outside
      document.addEventListener('click', e => {
        if (!e.target.closest('.country-selector')) {
          document.getElementById('selectorDropdown').style.display = 'none';
        }
      });
    }

    // Initialize country dropdown - now handled by loadData()
    async function initDropdown() {
      // Countries are already loaded by loadData(), just update the display
      const display = document.getElementById('selectorDisplay');
      if (display) {
        display.querySelector('span:first-child').textContent = 'Select countries...';
      }
    }

    // Initialize app on page load
    document.addEventListener('DOMContentLoaded', () => {
      setupEventListeners();
      loadData();
    });

    function toggleDropdown() {
      const d = document.getElementById('selectorDropdown');
      d.style.display = d.style.display === 'block' ? 'none' : 'block';
      if (d.style.display === 'block') {
        document.getElementById('countrySearch').focus();
      }
    }

    function filterCountries() {
      const q = document.getElementById('countrySearch').value.toLowerCase();
      document.querySelectorAll('.country-item').forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(q) ? 'flex' : 'none';
      });
    }

    function updateSelection() {
      selectedCountries = Array.from(document.querySelectorAll('#countryList input:checked')).map(cb => cb.value);
      const display = document.getElementById('selectorDisplay');
      const firstSpan = display.querySelector('span:first-child');

      if (selectedCountries.length === 0) {
        firstSpan.textContent = 'Select countries...';
      } else if (selectedCountries.length === 1) {
        firstSpan.textContent = selectedCountries[0];
      } else {
        firstSpan.textContent = `${selectedCountries.length} countries selected`;
      }
    }

    // Handle plan type checkbox logic (mutually exclusive include/exclude)
    function handlePlanTypeChange(changedId) {
      const globalInclude = document.getElementById('globalInclude');
      const globalExclude = document.getElementById('globalExclude');
      const regionalInclude = document.getElementById('regionalInclude');
      const regionalExclude = document.getElementById('regionalExclude');

      // Ensure only one of include/exclude can be checked for each type
      if (changedId === 'globalInclude' && globalInclude.checked) {
        globalExclude.checked = false;
      } else if (changedId === 'globalExclude' && globalExclude.checked) {
        globalInclude.checked = false;
      }

      if (changedId === 'regionalInclude' && regionalInclude.checked) {
        regionalExclude.checked = false;
      } else if (changedId === 'regionalExclude' && regionalExclude.checked) {
        regionalInclude.checked = false;
      }
    }

    // Find plans from Google Sheets data
    async function findPlans() {
      if (selectedCountries.length === 0) {
        alert('Please select at least one country.');
        return;
      }

      // Hide empty state, show results section
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('resultsSection').style.display = 'block';
      document.getElementById('loadingState').style.display = 'block';
      document.getElementById('productGrid').innerHTML = '';
      document.getElementById('errorState').style.display = 'none';
      document.getElementById('noResultsState').style.display = 'none';
      document.getElementById('comparisonSection').style.display = 'none';

      try {
        // Filter products that include ALL selected countries (AND logic)
        let plans = allProducts.filter(product =>
          selectedCountries.every(selectedCountry => product.countries.includes(selectedCountry))
        );

        if (plans.length === 0) {
          document.getElementById('loadingState').style.display = 'none';
          document.getElementById('noResultsState').style.display = 'block';
          filteredPlans = [];
          return;
        }

        filteredPlans = plans;

        // Apply initial sorting
        sortPlans(filteredPlans);

        // Render products
        document.getElementById('loadingState').style.display = 'none';
        renderProductGrid(filteredPlans);

      } catch (e) {
        console.error('❌ Search failed:', e);
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('errorState').innerHTML = `
          <p>⚠️ Search failed: ${e.message}</p>
        `;
        document.getElementById('errorState').style.display = 'block';
      }
    }

    // Handle plan type checkbox logic (mutually exclusive include/exclude)
    function handlePlanTypeChange(changedId) {
      const globalInclude = document.getElementById('globalInclude');
      const globalExclude = document.getElementById('globalExclude');
      const regionalInclude = document.getElementById('regionalInclude');
      const regionalExclude = document.getElementById('regionalExclude');
      
      // Ensure only one of include/exclude can be checked for each type
      if (changedId === 'globalInclude' && globalInclude.checked) {
        globalExclude.checked = false;
      } else if (changedId === 'globalExclude' && globalExclude.checked) {
        globalInclude.checked = false;
      }
      
      if (changedId === 'regionalInclude' && regionalInclude.checked) {
        regionalExclude.checked = false;
      } else if (changedId === 'regionalExclude' && regionalExclude.checked) {
        regionalInclude.checked = false;
      }
    }
    
    // Sort plans according to requirements
    function sortPlans(plans) {
      plans.sort((a, b) => {
        // 1. Global plans first (check if countries array contains "Global" or similar)
        const aIsGlobal = a.countries && a.countries.some(c => c.toLowerCase().includes('global') || c === 'Worldwide');
        const bIsGlobal = b.countries && b.countries.some(c => c.toLowerCase().includes('global') || c === 'Worldwide');
        
        if (aIsGlobal && !bIsGlobal) return -1;
        if (!aIsGlobal && bIsGlobal) return 1;
        
        // 2. Number of countries (ascending)
        const aCountryCount = a.countries ? a.countries.length : 0;
        const bCountryCount = b.countries ? b.countries.length : 0;
        
        if (aCountryCount !== bCountryCount) {
          return aCountryCount - bCountryCount;
        }
        
        // 3. First three letters of name (ascending) - using name instead of slug
        const aNamePrefix = (a.name || '').substring(0, 3).toLowerCase();
        const bNamePrefix = (b.name || '').substring(0, 3).toLowerCase();
        
        if (aNamePrefix !== bNamePrefix) {
          return aNamePrefix.localeCompare(bNamePrefix);
        }
        
        // 4. Duration (ascending) - parse duration string like "7 days"
        const aDuration = parseInt(a.duration) || 0;
        const bDuration = parseInt(b.duration) || 0;
        
        if (aDuration !== bDuration) {
          return aDuration - bDuration;
        }
        
        // 5. Data allowance in GB (ascending)
        const aDataGB = parseDataToGB(a.volume);
        const bDataGB = parseDataToGB(b.volume);
        
        if (aDataGB !== bDataGB) {
          return aDataGB - bDataGB;
        }
        
        // 6. Price (ascending) - parse price string like "$10.00"
        const aPrice = parseFloat(a.price.replace('$', '')) || 0;
        const bPrice = parseFloat(b.price.replace('$', '')) || 0;
        
        return aPrice - bPrice;
      });
    }
    
    // Parse data allowance to GB
    function parseDataToGB(dataValue) {
      if (!dataValue) return 0;
      
      const str = String(dataValue).toLowerCase();
      
      if (str === 'unlimited') return Infinity;
      
      const match = str.match(/([\d.]+)\s*(mb|gb|tb)?/);
      if (!match) return 0;
      
      const value = parseFloat(match[1]);
      const unit = match[2] || 'gb';
      
      switch (unit) {
        case 'mb': return value / 1024;
        case 'tb': return value * 1024;
        default: return value;
      }
    }
    
    // Determine plan type
    function getPlanType(plan) {
      const countryCount = plan.countries ? plan.countries.length : 0;
      const isGlobal = plan.countries && plan.countries.some(c => c.toLowerCase().includes('global') || c === 'Worldwide');
      
      if (isGlobal || countryCount > 10) return 'global';
      if (countryCount > 1) return 'regional';
      return 'local';
    }
    
    // Apply filters
    function applyFilters() {
      if (allProducts.length === 0) return;
      
      const minData = parseFloat(document.getElementById('minData').value) || 0;
      const maxData = parseFloat(document.getElementById('maxData').value) || Infinity;
      const minDuration = parseFloat(document.getElementById('minDuration').value) || 0;
      const maxDuration = parseFloat(document.getElementById('maxDuration').value) || Infinity;
      
      const globalInclude = document.getElementById('globalInclude').checked;
      const globalExclude = document.getElementById('globalExclude').checked;
      const regionalInclude = document.getElementById('regionalInclude').checked;
      const regionalExclude = document.getElementById('regionalExclude').checked;
      
      filteredPlans = allProducts.filter(plan => {
        // Data filter
        const planDataGB = parseDataToGB(plan.volume);
        if (planDataGB < minData || planDataGB > maxData) return false;
        
        // Duration filter
        const planDuration = parseInt(plan.duration) || 0;
        if (planDuration < minDuration || planDuration > maxDuration) return false;
        
        // Plan type filters
        const planType = getPlanType(plan);
        
        if (globalInclude && planType !== 'global') return false;
        if (globalExclude && planType === 'global') return false;
        if (regionalInclude && planType !== 'regional') return false;
        if (regionalExclude && planType === 'regional') return false;
        
        return true;
      });
      
      // Re-apply sorting
      sortPlans(filteredPlans);
      
      // Re-render
      renderProductGrid(filteredPlans);
    }
    
    // Render product grid
    function renderProductGrid(plans) {
      const grid = document.getElementById('productGrid');
      
      if (plans.length === 0) {
        grid.innerHTML = '';
        document.getElementById('noResultsState').style.display = 'block';
        return;
      }
      
      document.getElementById('noResultsState').style.display = 'none';
      
      grid.innerHTML = plans.map((plan, index) => {
        const planType = getPlanType(plan);
        const planTypeBadge = planType === 'global' ? '<span class="badge badge-global">Global</span>' :
                              planType === 'regional' ? '<span class="badge badge-regional">Regional</span>' :
                              '<span class="badge badge-local">Local</span>';
        
        const dataGB = parseDataToGB(plan.volume);
        const dataDisplay = dataGB === Infinity ? 'Unlimited' : `${dataGB.toFixed(1)} GB`;
        const speed = '4G/5G';
        const duration = plan.duration || 'N/A';
        const price = parseFloat(plan.price.replace('$', '')) || 0;
        const pricePerGB = dataGB === Infinity || dataGB === 0 ? 'N/A' : `$${(price / dataGB).toFixed(2)}`;
        const countryCount = plan.countries ? plan.countries.length : 0;
        
        const isCompared = comparedProducts.some(p => p.packageCode === plan.packageCode);
        
        return `
          <div class="product-card" data-package="${plan.packageCode || ''}">
            <div class="product-header">
              <div class="product-name">${plan.name || 'Unknown Plan'} ${planTypeBadge}</div>
              <div class="product-price">${plan.price}</div>
            </div>
            
            <div class="product-body">
              <div class="product-specs">
                <div class="spec-item">
                  <span class="spec-label">Data</span>
                  <span class="spec-value">${dataDisplay}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Speed</span>
                  <span class="spec-value">${speed}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Duration</span>
                  <span class="spec-value">${duration}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Price/GB</span>
                  <span class="spec-value">${pricePerGB}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Coverage</span>
                  <span class="spec-value">${countryCount} ${countryCount === 1 ? 'Country' : 'Countries'}</span>
                </div>
              </div>
            </div>
            
            <div class="compare-checkbox">
              <label>
                <input type="checkbox" onchange="toggleCompare('${plan.packageCode || ''}', ${index})" ${isCompared ? 'checked' : ''}>
                Add to Compare
              </label>
            </div>
            
            <div class="product-actions">
              <button class="secondary" onclick="toggleMoreInfo(this)">ℹ️ More Info</button>
              <button class="success" onclick="initiateCheckout('${plan.packageCode || ''}')">💳 Buy Now</button>
            </div>
            
            <div class="more-info-section">
              <div class="info-grid">
                <div class="spec-item">
                  <span class="spec-label">Package Code</span>
                  <span class="spec-value">${plan.packageCode || 'N/A'}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Countries</span>
                  <span class="spec-value">${plan.countries ? plan.countries.join(', ') : 'N/A'}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Operators</span>
                  <span class="spec-value">${plan.operators || 'N/A'}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Active Type</span>
                  <span class="spec-value">${plan.activeType || 'N/A'}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">IP Export</span>
                  <span class="spec-value">${plan.ipExport || 'N/A'}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">SMS Status</span>
                  <span class="spec-value">${plan.smsStatus || 'N/A'}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Top-Up Support</span>
                  <span class="spec-value">${plan.supportTopUp || 'N/A'}</span>
                </div>
              </div>
              
              <div class="coverage-section">
                <div class="coverage-header" onclick="toggleCoverageList(this)">
                  <span>🌍 Coverage & Networks</span>
                  <span class="coverage-count">(${countryCount} countries - Click to ${plan.locationNetworkList && plan.locationNetworkList.length > 10 ? 'expand' : 'toggle'})</span>
                </div>
                <div class="coverage-list" style="display: none;">
                  ${plan.locationNetworkList ? plan.locationNetworkList.map((loc, locIndex) => {
                    const operators = loc.operatorList || [];
                    const operatorsJson = encodeURIComponent(JSON.stringify(operators));
                    return `
                      <span class="coverage-item" onclick="showOperatorPopup('${loc.locationName || 'Unknown'}', '${operatorsJson}')">
                        ${loc.locationName || 'Unknown'} ${operators.length > 0 ? `(${operators.length})` : ''}
                      </span>
                    `;
                  }).join('') : '<span>No coverage info available</span>'}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    // Toggle more info section
    function toggleMoreInfo(button) {
      const card = button.closest('.product-card');
      const moreInfo = card.querySelector('.more-info-section');
      const isExpanded = moreInfo.classList.contains('expanded');
      
      moreInfo.classList.toggle('expanded');
      button.textContent = isExpanded ? 'ℹ️ More Info' : '🔼 Less Info';
    }
    
    // Toggle coverage list
    function toggleCoverageList(header) {
      const list = header.nextElementSibling;
      const count = header.querySelector('.coverage-count');
      
      if (list.style.display === 'none') {
        list.style.display = 'flex';
        count.textContent = count.textContent.replace('expand', 'collapse');
      } else {
        list.style.display = 'none';
        count.textContent = count.textContent.replace('collapse', 'expand');
      }
    }
    
    // Show operator popup
    function showOperatorPopup(countryName, operatorsJson) {
      const operators = JSON.parse(decodeURIComponent(operatorsJson));
      const popup = document.getElementById('operatorPopup');
      const overlay = document.getElementById('popupOverlay');
      const title = document.getElementById('popupCountryName');
      const list = document.getElementById('operatorList');
      
      title.textContent = `${countryName} - Network Operators`;
      
      if (operators.length === 0) {
        list.innerHTML = '<p style="color: #64748b;">No operator information available.</p>';
      } else {
        list.innerHTML = operators.map(op => `
          <div class="operator-item">
            <span class="operator-name">${op.operatorName || op.name || 'Unknown Operator'}</span>
            <span class="operator-type">${op.networkType || op.type || 'N/A'}</span>
          </div>
        `).join('');
      }
      
      popup.classList.add('active');
      overlay.classList.add('active');
    }
    
    // Close operator popup
    function closeOperatorPopup() {
      document.getElementById('operatorPopup').classList.remove('active');
      document.getElementById('popupOverlay').classList.remove('active');
    }
    
    // Toggle product comparison
    function toggleCompare(identifier, index) {
      const plan = filteredPlans[index];
      const existingIndex = comparedProducts.findIndex(p => 
        p.packageCode === plan.packageCode
      );
      
      if (existingIndex >= 0) {
        comparedProducts.splice(existingIndex, 1);
      } else {
        comparedProducts.push(plan);
      }
      
      // Update comparison section
      const comparisonSection = document.getElementById('comparisonSection');
      const compareCount = document.getElementById('compareCount');
      
      if (comparedProducts.length >= 2) {
        comparisonSection.style.display = 'block';
        compareCount.textContent = comparedProducts.length;
        renderComparisonTable();
      } else {
        comparisonSection.style.display = 'none';
        comparedProducts = []; // Clear if less than 2
      }
    }
    
    // Clear comparison
    function clearComparison() {
      comparedProducts = [];
      document.getElementById('comparisonSection').style.display = 'none';
      
      // Uncheck all compare checkboxes
      document.querySelectorAll('.compare-checkbox input[type="checkbox"]').forEach(cb => {
        cb.checked = false;
      });
      
      // Re-render to update checkboxes
      renderProductGrid(filteredPlans);
    }
    
    // Render comparison table
    function renderComparisonTable() {
      const container = document.getElementById('comparisonTableContainer');
      
      if (comparedProducts.length < 2) {
        container.innerHTML = '';
        return;
      }
      
      let html = '<table class="comparison-table"><thead><tr><th>Feature</th>';
      
      comparedProducts.forEach(plan => {
        html += `<th>${plan.name || 'Unknown'}</th>`;
      });
      
      html += '</tr></thead><tbody>';
      
      // Rows for comparison
      const rows = [
        { label: 'Price', getValue: p => p.price },
        { label: 'Data Allowance', getValue: p => {
          const gb = parseDataToGB(p.volume);
          return gb === Infinity ? 'Unlimited' : `${gb.toFixed(1)} GB`;
        }},
        { label: 'Duration', getValue: p => p.duration || 'N/A' },
        { label: 'Speed', getValue: p => '4G/5G' },
        { label: 'Price/GB', getValue: p => {
          const gb = parseDataToGB(p.volume);
          if (gb === Infinity || gb === 0) return 'N/A';
          const priceNum = parseFloat(p.price.replace('$', '')) || 0;
          return `$${(priceNum / gb).toFixed(2)}`;
        }},
        { label: 'Countries Covered', getValue: p => p.countries ? p.countries.length : 0 },
        { label: 'Package Code', getValue: p => p.packageCode || 'N/A' },
        { label: 'IP Export', getValue: p => p.ipExport || 'N/A' },
        { label: 'Active Type', getValue: p => p.activeType || 'N/A' },
        { label: 'SMS Status', getValue: p => p.smsStatus || 'N/A' },
        { label: 'Top-Up Support', getValue: p => p.supportTopUp || 'N/A' },
        { label: 'Plan Type', getValue: p => {
          const type = getPlanType(p);
          return type.charAt(0).toUpperCase() + type.slice(1);
        }}
      ];
      
      rows.forEach(row => {
        html += `<tr><td><strong>${row.label}</strong></td>`;
        comparedProducts.forEach(plan => {
          html += `<td>${row.getValue(plan)}</td>`;
        });
        html += '</tr>';
      });
      
      html += '</tbody></table>';
      container.innerHTML = html;
    }
    
    // Initiate checkout with Stripe
    async function initiateCheckout(planIdentifier) {
      // Find the plan
      const plan = allProducts.find(p => 
        p.packageCode === planIdentifier
      );
      
      if (!plan) {
        alert('Plan not found. Please try again.');
        return;
      }
      
      // In production, you would call your backend to create a Stripe Checkout Session
      // For now, we'll show an alert with plan details
      
      const planType = getPlanType(plan);
      const dataGB = parseDataToGB(plan.volume);
      const dataDisplay = dataGB === Infinity ? 'Unlimited' : `${dataGB.toFixed(1)} GB`;
      
      alert(`
        🛒 Checkout Initiated
        
        Plan: ${plan.name}
        Type: ${planType.charAt(0).toUpperCase() + planType.slice(1)}
        Data: ${dataDisplay}
        Duration: ${plan.duration}
        Price: ${plan.price}
        Countries: ${plan.countries.join(', ')}
        
        ⚠️ Stripe integration requires backend server.
        See README.md for setup instructions.
      `);
      
      // TODO: Implement actual Stripe checkout
      // This would typically involve:
      // 1. Call your backend API to create a Stripe Checkout Session
      // 2. Redirect user to Stripe Checkout URL
      // 3. Handle webhook events for payment confirmation
      // 4. Call eSIMaccess API to purchase and activate eSIM upon successful payment
    }
  </script>
</body>
