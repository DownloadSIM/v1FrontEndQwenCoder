<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Download SIM | Travel Essentials for the Globals</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 20px;
            color: #1e2a3a;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        h1 { font-size: 1.8rem; margin-bottom: 0.25rem; color: #0f3b5c; }
        .subtitle { color: #4a627a; margin-bottom: 2rem; border-left: 4px solid #2c7da0; padding-left: 1rem; }

        /* Country selector (same as before, keep original) */
        .selector-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
        }
        .selected-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            min-height: 48px;
            align-items: center;
        }
        .chip {
            background: #eef2f9;
            color: #1f5e7a;
            padding: 6px 12px 6px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #dce5ed;
        }
        .chip button {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #5c6f87;
            line-height: 1;
            padding: 0 4px;
        }
        .chip button:hover { color: #c72a2a; }
        
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .open-dropdown-btn {
            background: #2c7da0;
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 40px;
            cursor: pointer;
        }
        .show-plans-btn {
            background: #1f5e7a;
            color: white;
            border: none;
            padding: 10px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
        }
        .show-plans-btn:hover, .open-dropdown-btn:hover { opacity: 0.9; }

        .dropdown-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .dropdown-panel {
            background: white;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            border-radius: 28px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* ... keep all existing styles for dropdown, product grid, etc. ... */
        /* For brevity, I'm omitting the full CSS here. Use the CSS from the previous complete HTML file. */
        /* But to save space, I'll include only the new modal styles and assume you have the rest. */
        
        /* New modal styles for product info, email, OTP */
        .checkout-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 3000;
            align-items: center;
            justify-content: center;
        }
        .checkout-modal-content {
            background: white;
            width: 90%;
            max-width: 450px;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .checkout-modal-header {
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
        }
        .checkout-modal-body {
            margin: 1rem 0;
        }
        .checkout-modal-body input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }
        .checkout-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 1rem;
        }
        .checkout-modal-actions button {
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-primary {
            background: #2c7da0;
            color: white;
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #475569;
        }
        .error-message {
            color: #e53e3e;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }
        .success-message {
            color: #2f855a;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }
        .product-info-line {
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>
    <!-- Your existing HTML for country selector, product grid, etc. goes here -->
    <!-- I'll provide a minimal version; you should merge with your existing body content -->
    <div class="container">
        <h1>🌏 eSIM Product Finder</h1>
        <div class="subtitle">Select one or more countries – then click “Show plans”</div>
        <div class="selector-card">
            <div id="selectedChips" class="selected-chips"></div>
            <div class="action-bar">
                <button id="openDropdownBtn" class="open-dropdown-btn">✈️ Select Countries</button>
                <button id="showPlansBtn" class="show-plans-btn">🔍 Show plans</button>
            </div>
        </div>
        <div class="compare-bar">
            <div class="stats" id="statsPlaceholder">Loading product catalog...</div>
            <button id="compareBtn" class="compare-btn" disabled>Compare Selected (0)</button>
        </div>
        <div id="productList" class="product-grid"></div>
        <footer>DownloadSIM™ | Since 2025</footer>
    </div>

    <!-- Modals for checkout flow -->
    <!-- Modal 1: Product Info -->
    <div id="productInfoModal" class="checkout-modal">
        <div class="checkout-modal-content">
            <div class="checkout-modal-header">
                <h3>Confirm Your eSIM Plan</h3>
            </div>
            <div class="checkout-modal-body" id="productInfoBody">
                <!-- dynamic product details -->
            </div>
            <div class="checkout-modal-actions">
                <button id="cancelProductBtn" class="btn-secondary">Cancel</button>
                <button id="proceedToEmailBtn" class="btn-primary">Buy</button>
            </div>
        </div>
    </div>

    <!-- Modal 2: Email Entry -->
    <div id="emailModal" class="checkout-modal">
        <div class="checkout-modal-content">
            <div class="checkout-modal-header">
                <h3>Enter Your Email</h3>
            </div>
            <div class="checkout-modal-body">
                <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="off">
                <div id="emailError" class="error-message" style="display:none;"></div>
                <div id="emailSuccess" class="success-message" style="display:none;"></div>
            </div>
            <div class="checkout-modal-actions">
                <button id="cancelEmailBtn" class="btn-secondary">Cancel</button>
                <button id="sendOtpBtn" class="btn-primary">Send OTP</button>
            </div>
        </div>
    </div>

    <!-- Modal 3: OTP Entry -->
    <div id="otpModal" class="checkout-modal">
        <div class="checkout-modal-content">
            <div class="checkout-modal-header">
                <h3>Verify One-Time Password</h3>
            </div>
            <div class="checkout-modal-body">
                <input type="text" id="otpInput" placeholder="Enter 6-digit code" maxlength="6" autocomplete="off">
                <div id="otpError" class="error-message" style="display:none;"></div>
                <div id="otpSuccess" class="success-message" style="display:none;"></div>
            </div>
            <div class="checkout-modal-actions">
                <button id="cancelOtpBtn" class="btn-secondary">Cancel</button>
                <button id="verifyOtpBtn" class="btn-primary">Next</button>
                <button id="finalOkBtn" class="btn-primary" style="display:none;">OK</button>
            </div>
        </div>
    </div>

    <script>
        // ========== Load product catalog and render product cards (same as before) ==========
        // For brevity, I'm including only the checkout flow JS.
        // You must merge this with your existing product loading logic.
        // I'll provide a complete merged version later if needed.
        
        let currentProduct = null;   // store product details from API
        let currentEmail = null;
        let currentOtp = null;
        let otpVerified = false;

        // References to modals
        const productInfoModal = document.getElementById('productInfoModal');
        const emailModal = document.getElementById('emailModal');
        const otpModal = document.getElementById('otpModal');
        const productInfoBody = document.getElementById('productInfoBody');
        const emailInput = document.getElementById('emailInput');
        const emailError = document.getElementById('emailError');
        const emailSuccess = document.getElementById('emailSuccess');
        const otpInput = document.getElementById('otpInput');
        const otpError = document.getElementById('otpError');
        const otpSuccess = document.getElementById('otpSuccess');
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        const finalOkBtn = document.getElementById('finalOkBtn');

        // When user clicks "Buy Now" on a product card
        function initiateCheckout(productData) {
            currentProduct = productData;
            // Display product info in modal
            const priceDollars = (productData.price / 100).toFixed(2);
            productInfoBody.innerHTML = `
                <div class="product-info-line"><strong>Product:</strong> ${productData.product_name || productData.name}</div>
                <div class="product-info-line"><strong>Package Code:</strong> ${productData.package_code || productData.packageCode}</div>
                <div class="product-info-line"><strong>Data:</strong> ${(productData.volume_gb || (productData.volume_bytes / 1073741824).toFixed(2))} GB</div>
                <div class="product-info-line"><strong>Validity:</strong> ${productData.validity_days || productData.duration} days</div>
                <div class="product-info-line"><strong>Price:</strong> $${priceDollars}</div>
            `;
            productInfoModal.style.display = 'flex';
        }

        // Step 1: Cancel product modal
        document.getElementById('cancelProductBtn').addEventListener('click', () => {
            productInfoModal.style.display = 'none';
            currentProduct = null;
        });

        // Step 1 -> Step 2: Proceed to email modal
        document.getElementById('proceedToEmailBtn').addEventListener('click', () => {
            productInfoModal.style.display = 'none';
            emailModal.style.display = 'flex';
        });

        // Cancel email modal
        document.getElementById('cancelEmailBtn').addEventListener('click', () => {
            emailModal.style.display = 'none';
            emailInput.value = '';
            emailError.style.display = 'none';
            emailSuccess.style.display = 'none';
        });

        // Send OTP
        sendOtpBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            if (!email || !email.includes('@') || !email.includes('.')) {
                emailError.textContent = 'Please enter a valid email address.';
                emailError.style.display = 'block';
                return;
            }
            emailError.style.display = 'none';
            sendOtpBtn.disabled = true;
            sendOtpBtn.textContent = 'Sending...';
            try {
                // Call ActivePieces webhook to generate and send OTP
                const response = await fetch('YOUR_SEND_OTP_WEBHOOK_URL/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const result = await response.json();
                if (result.success) {
                    currentEmail = email;
                    emailSuccess.textContent = 'OTP sent to your email. Please check your inbox.';
                    emailSuccess.style.display = 'block';
                    // Move to OTP modal after short delay
                    setTimeout(() => {
                        emailModal.style.display = 'none';
                        otpModal.style.display = 'flex';
                        emailInput.value = '';
                        emailSuccess.style.display = 'none';
                        sendOtpBtn.disabled = false;
                        sendOtpBtn.textContent = 'Send OTP';
                    }, 1500);
                } else {
                    emailError.textContent = result.error || 'Failed to send OTP. Please try again.';
                    emailError.style.display = 'block';
                    sendOtpBtn.disabled = false;
                    sendOtpBtn.textContent = 'Send OTP';
                }
            } catch (err) {
                emailError.textContent = 'Network error. Please try again.';
                emailError.style.display = 'block';
                sendOtpBtn.disabled = false;
                sendOtpBtn.textContent = 'Send OTP';
            }
        });

        // Cancel OTP modal
        document.getElementById('cancelOtpBtn').addEventListener('click', () => {
            otpModal.style.display = 'none';
            otpInput.value = '';
            otpError.style.display = 'none';
            otpSuccess.style.display = 'none';
            verifyOtpBtn.style.display = 'inline-block';
            finalOkBtn.style.display = 'none';
            otpVerified = false;
        });

        // Verify OTP
        verifyOtpBtn.addEventListener('click', async () => {
            const otp = otpInput.value.trim();
            if (!otp || otp.length < 4) {
                otpError.textContent = 'Please enter the OTP you received.';
                otpError.style.display = 'block';
                return;
            }
            otpError.style.display = 'none';
            verifyOtpBtn.disabled = true;
            verifyOtpBtn.textContent = 'Verifying...';
            try {
                const response = await fetch('YOUR_VERIFY_OTP_WEBHOOK_URL/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp: otp })
                });
                const result = await response.json();
                if (result.valid) {
                    currentOtp = otp;
                    otpVerified = true;
                    otpSuccess.textContent = 'Email verified successfully!';
                    otpSuccess.style.display = 'block';
                    // Change button to OK
                    verifyOtpBtn.style.display = 'none';
                    finalOkBtn.style.display = 'inline-block';
                } else {
                    otpError.textContent = 'Invalid OTP. Please try again.';
                    otpError.style.display = 'block';
                    verifyOtpBtn.disabled = false;
                    verifyOtpBtn.textContent = 'Next';
                }
            } catch (err) {
                otpError.textContent = 'Verification failed. Please try again.';
                otpError.style.display = 'block';
                verifyOtpBtn.disabled = false;
                verifyOtpBtn.textContent = 'Next';
            }
        });

        // Final OK: proceed to Stripe checkout
        finalOkBtn.addEventListener('click', async () => {
            if (!otpVerified) return;
            finalOkBtn.disabled = true;
            finalOkBtn.textContent = 'Processing...';
            try {
                // Call Stripe checkout webhook with verified email and product details
                const response = await fetch('YOUR_STRIPE_CHECKOUT_WEBHOOK_URL/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: currentEmail,
                        product: currentProduct
                    })
                });
                const result = await response.json();
                if (result.sessionUrl) {
                    window.location.href = result.sessionUrl;
                } else {
                    alert('Could not create checkout session. Please contact support.');
                    finalOkBtn.disabled = false;
                    finalOkBtn.textContent = 'OK';
                }
            } catch (err) {
                alert('Payment initiation failed. Please try again.');
                finalOkBtn.disabled = false;
                finalOkBtn.textContent = 'OK';
            }
        });

        // ========== Integrate with your existing product card "Buy Now" button ==========
        // You need to modify the product card rendering to call initiateCheckout(productData)
        // The productData should come from your ActivePieces fetch.
        // Example: when you fetch fullProduct, call initiateCheckout(fullProduct) instead of showing alert.
    </script>
</body>
</html>
