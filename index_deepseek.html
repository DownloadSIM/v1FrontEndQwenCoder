<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Download SIM | Travel Essentials for the Globals</title>
    <style>
        /* Include all your existing styles (same as before, no changes needed) */
        /* For brevity, I'm not repeating the entire CSS. Keep your current styles. */
        /* Modal styles (same as previous) */
        .checkout-modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:3000; align-items:center; justify-content:center; }
        .checkout-modal-content { background:white; width:90%; max-width:450px; border-radius:24px; padding:1.5rem; }
        .checkout-modal-header { border-bottom:1px solid #e2e8f0; margin-bottom:1rem; padding-bottom:0.5rem; }
        .checkout-modal-body { margin:1rem 0; }
        .checkout-modal-body input { width:100%; padding:12px; font-size:1rem; border:1px solid #cbd5e1; border-radius:8px; margin-bottom:0.5rem; }
        .checkout-modal-actions { display:flex; justify-content:flex-end; gap:12px; margin-top:1rem; }
        .btn-primary { background:#2c7da0; color:white; padding:8px 20px; border-radius:8px; border:none; cursor:pointer; }
        .btn-secondary { background:#e2e8f0; color:#475569; padding:8px 20px; border-radius:8px; border:none; cursor:pointer; }
        .error-message { color:#e53e3e; font-size:0.8rem; margin-top:0.5rem; }
        .success-message { color:#2f855a; font-size:0.8rem; margin-top:0.5rem; }
    </style>
</head>
<body>
    <!-- Your existing product listing HTML (unchanged) -->
    <div class="container">
        <h1>🌏 eSIM Product Finder</h1>
        <div class="subtitle">Select one or more countries – then click “Show plans”</div>
        <div class="selector-card">
            <div id="selectedChips" class="selected-chips"></div>
            <div class="action-bar">
                <button id="openDropdownBtn" class="open-dropdown-btn">✈️ Select Countries</button>
                <button id="showPlansBtn" class="show-plans-btn">🔍 Show plans</button>
            </div>
        </div>
        <div class="compare-bar">
            <div class="stats" id="statsPlaceholder">Loading product catalog...</div>
            <button id="compareBtn" class="compare-btn" disabled>Compare Selected (0)</button>
        </div>
        <div id="productList" class="product-grid"></div>
        <footer>DownloadSIM™ | Since 2025</footer>
    </div>

    <!-- Modals -->
    <!-- Email modal (first popup after Buy Now) -->
    <div id="emailModal" class="checkout-modal">
        <div class="checkout-modal-content">
            <div class="checkout-modal-header"><h3>Enter Your Email</h3></div>
            <div class="checkout-modal-body">
                <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="off">
                <div id="emailError" class="error-message" style="display:none;"></div>
            </div>
            <div class="checkout-modal-actions">
                <button id="cancelEmailBtn" class="btn-secondary">Cancel</button>
                <button id="sendOtpBtn" class="btn-primary">Send OTP</button>
            </div>
        </div>
    </div>

    <!-- OTP modal -->
    <div id="otpModal" class="checkout-modal">
        <div class="checkout-modal-content">
            <div class="checkout-modal-header"><h3>Verify OTP</h3></div>
            <div class="checkout-modal-body">
                <input type="text" id="otpInput" placeholder="Enter 6-digit code" maxlength="6">
                <div id="otpError" class="error-message" style="display:none;"></div>
                <div id="otpSuccess" class="success-message" style="display:none;"></div>
            </div>
            <div class="checkout-modal-actions">
                <button id="cancelOtpBtn" class="btn-secondary">Cancel</button>
                <button id="verifyOtpBtn" class="btn-primary">Verify</button>
                <button id="finalOkBtn" class="btn-primary" style="display:none;">OK</button>
            </div>
        </div>
    </div>

    <script>
        // ========== Keep your existing product loading and rendering code (unchanged) ==========
        // For brevity, I'm not repeating all of it. You must keep your existing loadData, renderProductCards, etc.
        // The only change is inside the "Buy Now" button event listener: it should open the email modal and store the packageCode for later use.
        // Below I show the modified Buy Now handler.

        let pendingPackageCode = null;   // store SKU until email is verified
        let currentEmail = null;

        // Replace your existing btn-buy event listener with this:
        document.querySelectorAll('.btn-buy').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const packageCode = btn.getAttribute('data-package');
                pendingPackageCode = packageCode;
                // Open email modal (do NOT fetch product yet)
                document.getElementById('emailModal').style.display = 'flex';
            });
        });

        // Email modal logic
        const emailModal = document.getElementById('emailModal');
        const emailInput = document.getElementById('emailInput');
        const emailError = document.getElementById('emailError');
        const cancelEmailBtn = document.getElementById('cancelEmailBtn');
        const sendOtpBtn = document.getElementById('sendOtpBtn');

        cancelEmailBtn.addEventListener('click', () => {
            emailModal.style.display = 'none';
            emailInput.value = '';
            emailError.style.display = 'none';
            pendingPackageCode = null;
        });

        sendOtpBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            if (!email || !email.includes('@')) {
                emailError.textContent = 'Valid email required.';
                emailError.style.display = 'block';
                return;
            }
            emailError.style.display = 'none';
            sendOtpBtn.disabled = true;
            sendOtpBtn.textContent = 'Sending...';
            try {
                // Call your Send OTP webhook
                const resp = await fetch('YOUR_SEND_OTP_WEBHOOK_URL/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await resp.json();
                if (data.success) {
                    currentEmail = email;
                    emailModal.style.display = 'none';
                    document.getElementById('otpModal').style.display = 'flex';
                } else {
                    emailError.textContent = data.error || 'Failed to send OTP.';
                    emailError.style.display = 'block';
                }
            } catch (err) {
                emailError.textContent = 'Network error.';
                emailError.style.display = 'block';
            } finally {
                sendOtpBtn.disabled = false;
                sendOtpBtn.textContent = 'Send OTP';
            }
        });

        // OTP modal logic
        const otpModal = document.getElementById('otpModal');
        const otpInput = document.getElementById('otpInput');
        const otpError = document.getElementById('otpError');
        const otpSuccess = document.getElementById('otpSuccess');
        const cancelOtpBtn = document.getElementById('cancelOtpBtn');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        const finalOkBtn = document.getElementById('finalOkBtn');

        cancelOtpBtn.addEventListener('click', () => {
            otpModal.style.display = 'none';
            otpInput.value = '';
            otpError.style.display = 'none';
            otpSuccess.style.display = 'none';
            verifyOtpBtn.style.display = 'inline-block';
            finalOkBtn.style.display = 'none';
            pendingPackageCode = null;
            currentEmail = null;
        });

        verifyOtpBtn.addEventListener('click', async () => {
            const otp = otpInput.value.trim();
            if (!otp) {
                otpError.textContent = 'Enter OTP.';
                otpError.style.display = 'block';
                return;
            }
            otpError.style.display = 'none';
            verifyOtpBtn.disabled = true;
            verifyOtpBtn.textContent = 'Verifying...';
            try {
                const resp = await fetch('YOUR_VERIFY_OTP_WEBHOOK_URL/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp })
                });
                const data = await resp.json();
                if (data.valid) {
                    otpSuccess.textContent = 'Email verified! Fetching product details...';
                    otpSuccess.style.display = 'block';
                    verifyOtpBtn.style.display = 'none';
                    finalOkBtn.style.display = 'inline-block';
                } else {
                    otpError.textContent = 'Invalid OTP. Try again.';
                    otpError.style.display = 'block';
                    verifyOtpBtn.disabled = false;
                    verifyOtpBtn.textContent = 'Verify';
                }
            } catch (err) {
                otpError.textContent = 'Verification failed.';
                otpError.style.display = 'block';
                verifyOtpBtn.disabled = false;
                verifyOtpBtn.textContent = 'Verify';
            }
        });

        finalOkBtn.addEventListener('click', async () => {
            finalOkBtn.disabled = true;
            finalOkBtn.textContent = 'Processing...';
            try {
                // Now fetch the product details from eSIMaccess API via ActivePieces using the pendingPackageCode
                const productResp = await fetch('YOUR_FETCH_PRODUCT_WEBHOOK_URL/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ packageCode: pendingPackageCode })
                });
                const product = await productResp.json();
                if (!product.product_name) throw new Error('Product fetch failed');
                
                // Then create Stripe checkout session with the fetched product and verified email
                const checkoutResp = await fetch('YOUR_STRIPE_CHECKOUT_WEBHOOK_URL/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: currentEmail,
                        product: product
                    })
                });
                const checkout = await checkoutResp.json();
                if (checkout.sessionUrl) {
                    window.location.href = checkout.sessionUrl;
                } else {
                    alert('Checkout session creation failed.');
                }
            } catch (err) {
                alert('Error: ' + err.message);
                finalOkBtn.disabled = false;
                finalOkBtn.textContent = 'OK';
            }
        });
    </script>
</body>
</html>
