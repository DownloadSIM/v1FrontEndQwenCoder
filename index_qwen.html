<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Download SIM - eSIM Store</title>
<style>
:root {
--primary: #2563eb;
--primary-dark: #1d4ed8;
--success: #10b981;
--bg: #f8fafc;
--card: #fff;
--border: #e2e8f0;
--text: #0f172a;
--muted: #64748b;
--header-bg: #ffffff;
--shadow: 0 4px 12px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
body {
background: var(--bg);
color: var(--text);
padding-top: 140px; /* Space for fixed header */
}
.container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
/* Fixed Header Section */
.fixed-header {
position: fixed;
top: 0;
left: 0;
right: 0;
background: var(--header-bg);
box-shadow: var(--shadow);
z-index: 1000;
padding: 12px 20px;
}
.header-content {
max-width: 1400px;
margin: 0 auto;
}
.brand {
font-size: 1.5rem;
font-weight: 700;
color: var(--primary);
margin-bottom: 12px;
}
.search-row {
display: flex;
gap: 12px;
align-items: flex-end;
flex-wrap: wrap;
}
.filter-row {
display: flex;
gap: 16px;
align-items: center;
flex-wrap: wrap;
margin-top: 12px;
padding-top: 12px;
border-top: 1px solid var(--border);
}
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.range-group { display: flex; align-items: center; gap: 6px; }
input, select, button {
padding: 8px 12px;
border: 1px solid var(--border);
border-radius: 6px;
font-size: 0.9rem;
transition: all 0.2s;
}
input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
button {
background: var(--primary);
color: #fff;
border: none;
cursor: pointer;
font-weight: 600;
transition: all 0.2s;
}
button:hover { background: var(--primary-dark); transform: translateY(-1px); }
button:active { transform: translateY(0); }
button.secondary { background: var(--muted); }
button.success { background: var(--success); }
/* Country Selector */
.country-selector { position: relative; min-width: 280px; }
.selector-display {
background: #fff;
border: 1px solid var(--border);
padding: 8px 12px;
border-radius: 6px;
cursor: pointer;
display: flex;
justify-content: space-between;
align-items: center;
min-width: 280px;
}
.selector-display:hover { border-color: var(--primary); }
.selector-dropdown {
position: absolute;
top: 100%;
left: 0;
right: 0;
background: #fff;
border: 1px solid var(--border);
border-radius: 6px;
margin-top: 4px;
max-height: 300px;
overflow-y: auto;
z-index: 1001;
box-shadow: var(--shadow);
display: none;
}
.selector-dropdown input {
width: 100%;
border: none;
border-bottom: 1px solid var(--border);
border-radius: 0;
outline: none;
padding: 10px 12px;
}
.country-list { max-height: 250px; overflow-y: auto; }
.country-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; }
.country-item:hover { background: #f1f5f9; }
.country-item input { width: auto; margin: 0; }
/* Plan Type Checkboxes */
.plan-type-group {
display: flex;
gap: 16px;
align-items: center;
}
.checkbox-label {
display: flex;
align-items: center;
gap: 6px;
cursor: pointer;
font-size: 0.9rem;
font-weight: 500;
}
.checkbox-label input[type="checkbox"] {
width: 18px;
height: 18px;
cursor: pointer;
}
/* Results Area */
.results-section { padding: 20px 0 40px; }
.empty-state {
text-align: center;
padding: 80px 20px;
color: var(--muted);
}
.empty-state h2 {
font-size: 1.5rem;
margin-bottom: 8px;
color: var(--text);
}
.empty-state p {
font-size: 1rem;
}
.state { text-align: center; padding: 60px 20px; color: var(--muted); }
.loader {
border: 3px solid var(--border);
border-top-color: var(--primary);
border-radius: 50%;
width: 40px;
height: 40px;
animation: spin 1s linear infinite;
margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* Product Grid */
.product-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
gap: 20px;
margin-top: 20px;
}
.product-card {
background: var(--card);
border-radius: 10px;
box-shadow: 0 2px 8px rgba(0,0,0,0.06);
overflow: hidden;
transition: all 0.2s;
border: 1px solid var(--border);
}
.product-card:hover {
box-shadow: var(--shadow);
transform: translateY(-2px);
}
.product-header {
padding: 16px;
background: linear-gradient(135deg, #f8fafc 0%, #fff 100%);
border-bottom: 1px solid var(--border);
}
.product-name {
font-size: 1.1rem;
font-weight: 700;
color: var(--text);
margin-bottom: 4px;
}
.product-price {
font-size: 1.5rem;
font-weight: 700;
color: var(--primary);
}
.product-body {
padding: 16px;
}
.product-specs {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 12px;
margin-bottom: 16px;
}
.spec-item {
display: flex;
flex-direction: column;
gap: 4px;
}
.spec-label {
font-size: 0.75rem;
color: var(--muted);
text-transform: uppercase;
letter-spacing: 0.5px;
}
.spec-value {
font-size: 0.95rem;
font-weight: 600;
color: var(--text);
}
.product-actions {
display: flex;
gap: 8px;
padding: 16px;
border-top: 1px solid var(--border);
background: #f8fafc;
}
.product-actions button {
flex: 1;
padding: 10px;
font-size: 0.9rem;
}
.compare-checkbox {
display: flex;
align-items: center;
gap: 8px;
padding: 12px 16px;
background: #f8fafc;
border-top: 1px solid var(--border);
}
.compare-checkbox label {
display: flex;
align-items: center;
gap: 8px;
cursor: pointer;
font-size: 0.9rem;
font-weight: 500;
}
/* More Info Expandable */
.more-info-section {
display: none;
padding: 16px;
background: #f8fafc;
border-top: 1px solid var(--border);
}
.more-info-section.expanded {
display: block;
}
.info-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 12px;
margin-bottom: 16px;
}
.coverage-section {
margin-top: 16px;
}
.coverage-header {
display: flex;
justify-content: space-between;
align-items: center;
cursor: pointer;
padding: 8px 0;
font-weight: 600;
}
.coverage-count {
font-size: 0.85rem;
color: var(--muted);
font-weight: normal;
}
.coverage-list {
display: flex;
flex-wrap: wrap;
gap: 8px;
margin-top: 12px;
max-height: 300px;
overflow-y: auto;
}
.coverage-item {
background: #fff;
border: 1px solid var(--border);
padding: 6px 12px;
border-radius: 20px;
font-size: 0.85rem;
cursor: pointer;
transition: all 0.2s;
}
.coverage-item:hover {
border-color: var(--primary);
background: #eff6ff;
}
/* Operator Popup */
.operator-popup {
position: fixed;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
background: #fff;
border-radius: 12px;
box-shadow: 0 20px 60px rgba(0,0,0,0.3);
z-index: 2000;
max-width: 500px;
width: 90%;
max-height: 80vh;
overflow-y: auto;
display: none;
}
.operator-popup.active {
display: block;
}
.popup-header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 16px 20px;
border-bottom: 1px solid var(--border);
}
.popup-title {
font-size: 1.1rem;
font-weight: 700;
}
.popup-close {
background: none;
border: none;
font-size: 1.5rem;
cursor: pointer;
color: var(--muted);
padding: 4px;
}
.popup-close:hover {
color: var(--text);
}
.popup-body {
padding: 20px;
}
.operator-list {
display: flex;
flex-direction: column;
gap: 12px;
}
.operator-item {
display: flex;
justify-content: space-between;
align-items: center;
padding: 12px;
background: #f8fafc;
border-radius: 8px;
}
.operator-name {
font-weight: 600;
}
.operator-type {
font-size: 0.85rem;
color: var(--muted);
background: #fff;
padding: 4px 8px;
border-radius: 4px;
border: 1px solid var(--border);
}
.popup-overlay {
position: fixed;
top: 0;
left: 0;
right: 0;
bottom: 0;
background: rgba(0,0,0,0.5);
z-index: 1999;
display: none;
}
.popup-overlay.active {
display: block;
}
/* Comparison Table */
.comparison-section {
background: var(--card);
border-radius: 10px;
box-shadow: var(--shadow);
padding: 20px;
margin-bottom: 30px;
overflow-x: auto;
}
.comparison-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 16px;
}
.comparison-table {
width: 100%;
border-collapse: collapse;
min-width: 800px;
}
.comparison-table th,
.comparison-table td {
padding: 12px;
text-align: left;
border: 1px solid var(--border);
font-size: 0.9rem;
}
.comparison-table th {
background: #f8fafc;
font-weight: 600;
color: var(--muted);
min-width: 150px;
}
.comparison-table tr:nth-child(even) {
background: #f8fafc;
}
/* Badge Styles */
.badge {
display: inline-block;
padding: 4px 8px;
border-radius: 4px;
font-size: 0.75rem;
font-weight: 600;
text-transform: uppercase;
}
.badge-global {
background: #dbeafe;
color: #1e40af;
}
.badge-regional {
background: #fef3c7;
color: #92400e;
}
.badge-local {
background: #d1fae5;
color: #065f46;
}
/* Responsive */
@media (max-width: 768px) {
body { padding-top: 180px; }
.fixed-header { padding: 12px; }
.product-grid { grid-template-columns: 1fr; }
.search-row { flex-direction: column; align-items: stretch; }
.filter-row { flex-direction: column; align-items: stretch; }
.country-selector { min-width: 100%; }
.selector-display { min-width: 100%; }
.plan-type-group { flex-wrap: wrap; }
}
</style>
</head>
<body>
<!-- Fixed Header -->
<div class="fixed-header">
<div class="header-content">
<div class="brand">📱 Download SIM</div>
<div class="search-row">
<div class="field country-selector" id="countrySelector">
<label>Travel Destinations</label>
<div class="selector-display" id="selectorDisplay" onclick="toggleDropdown()">
<span>Select countries...</span>
<span>▼</span>
</div>
<div class="selector-dropdown" id="selectorDropdown">
<input type="text" id="countrySearch" placeholder="Search countries..." oninput="filterCountries()" />
<div class="country-list" id="countryList"></div>
</div>
</div>
<div class="field" style="justify-content: flex-end;">
<button id="findPlansBtn" style="padding: 8px 24px;">🔍 Find Plans</button>
</div>
</div>
<div class="filter-row">
<div class="field">
<label>Data (GB)</label>
<div class="range-group">
<input type="number" id="minData" placeholder="Min" step="0.1" min="0" style="width: 80px;">
<span>to</span>
<input type="number" id="maxData" placeholder="Max" step="0.1" min="0" style="width: 80px;">
</div>
</div>
<div class="field">
<label>Duration (Days)</label>
<div class="range-group">
<select id="minDuration" style="width: 80px;">
<option value="">Min</option>
<option>1</option><option>3</option><option>5</option><option>7</option>
<option>10</option><option>14</option><option>28</option><option>60</option>
<option>90</option><option>180</option><option>365</option>
</select>
<span>to</span>
<select id="maxDuration" style="width: 80px;">
<option value="">Max</option>
<option>1</option><option>3</option><option>5</option><option>7</option>
<option>10</option><option>14</option><option>28</option><option>60</option>
<option>90</option><option>180</option><option>365</option>
</select>
</div>
</div>
<div class="field">
<label>Plan Type</label>
<div class="plan-type-group">
<label class="checkbox-label">
<input type="checkbox" id="globalInclude" onchange="handlePlanTypeChange('globalInclude')">
Include Global
</label>
<label class="checkbox-label">
<input type="checkbox" id="globalExclude" onchange="handlePlanTypeChange('globalExclude')">
Exclude Global
</label>
<label class="checkbox-label">
<input type="checkbox" id="regionalInclude" onchange="handlePlanTypeChange('regionalInclude')">
Include Regional
</label>
<label class="checkbox-label">
<input type="checkbox" id="regionalExclude" onchange="handlePlanTypeChange('regionalExclude')">
Exclude Regional
</label>
</div>
</div>
<div class="field" style="justify-content: flex-end; margin-left: auto;">
<button class="secondary" id="applyFiltersBtn" style="padding: 8px 16px;">Apply Filters</button>
</div>
</div>
</div>
</div>
<!-- Main Content -->
<div class="container">
<!-- Empty State (shown initially) -->
<div id="emptyState" class="empty-state">
<h2>🌍 Please select your travel destinations</h2>
<p>Choose one or more countries above and click "Find Plans" to see available eSIM options.</p>
</div>
<!-- Results Section -->
<div id="resultsSection" class="results-section" style="display: none;">
<!-- Comparison Section (shown when 2+ products selected) -->
<div id="comparisonSection" class="comparison-section" style="display: none;">
<div class="comparison-header">
<h3>📊 Comparing <span id="compareCount">0</span> Products</h3>
<button class="secondary" onclick="clearComparison()">Clear Comparison</button>
</div>
<div id="comparisonTableContainer"></div>
</div>
<!-- Loading State -->
<div id="loadingState" class="state" style="display: none;">
<div class="loader"></div>
<p>Searching for plans...</p>
</div>
<!-- Error State -->
<div id="errorState" class="state" style="display: none;"></div>
<!-- No Results State -->
<div id="noResultsState" class="state" style="display: none;">
<p>⚠️ No plans found matching your criteria.</p>
</div>
<!-- Product Grid -->
<div id="productGrid" class="product-grid"></div>
</div>
</div>
<!-- Operator Popup -->
<div class="popup-overlay" id="popupOverlay" onclick="closeOperatorPopup()"></div>
<div class="operator-popup" id="operatorPopup">
<div class="popup-header">
<div class="popup-title" id="popupCountryName">Country Operators</div>
<button class="popup-close" onclick="closeOperatorPopup()">×</button>
</div>
<div class="popup-body">
<div class="operator-list" id="operatorList"></div>
</div>
</div>

<script>
// ==========================================
// CONFIGURATION
// ==========================================
const SHEET_ID = '1D6zQ91MYfbQL4XSClSWffSTOfmDFJoO4hEdpENB0_RY';
const COUNTRIES_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=AppsScript_Countries`;
const PRODUCTS_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=FRONTEND_Products`;

// TODO: Replace with your actual ActivePieces Webhook URL for Stripe Checkout
const APC_CHECKOUT_URL = 'YOUR_APC_CHECKOUT_URL';

// ==========================================
// STATE
// ==========================================
let selectedCountries = [];
let allPlans = [];
let cachedPlans = [];
let filteredPlans = [];
let comparedProducts = [];
let allCountries = [];

// ==========================================
// INITIALIZATION
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
    initDropdown();
    setupEventListeners();
});

function setupEventListeners() {
    document.getElementById('findPlansBtn').addEventListener('click', findPlans);
    document.getElementById('applyFiltersBtn').addEventListener('click', applyFilters);
    
    document.addEventListener('click', e => {
        if (!e.target.closest('.country-selector')) {
            document.getElementById('selectorDropdown').style.display = 'none';
        }
    });
}

// ==========================================
// CSV PARSER (Robust for quoted values)
// ==========================================
function parseCSV(text) {
    if (text.startsWith('\uFEFF')) text = text.substring(1); // Remove BOM if present
    const rows = [];
    let row = [];
    let inQuotes = false;
    let field = '';
    
    for (let i = 0; i < text.length; i++) {
        let c = text[i];
        if (inQuotes) {
            if (c === '"') {
                if (text[i + 1] === '"') { field += '"'; i++; } 
                else { inQuotes = false; }
            } else { field += c; }
        } else {
            if (c === '"') { inQuotes = true; } 
            else if (c === ',') { row.push(field); field = ''; } 
            else if (c === '\n' || c === '\r') {
                if (c === '\r' && text[i + 1] === '\n') i++;
                row.push(field); field = '';
                if (row.length > 1 || row[0] !== '') rows.push(row);
                row = [];
            } else { field += c; }
        }
    }
    row.push(field);
    if (row.length > 1 || row[0] !== '') rows.push(row);
    return rows;
}

// ==========================================
// COUNTRY DROPDOWN
// ==========================================
async function initDropdown() {
    const list = document.getElementById('countryList');
    list.innerHTML = '<div style="padding:12px; color:#64748b;">Loading countries...</div>';
    
    try {
        const res = await fetch(COUNTRIES_CSV_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        const rows = parseCSV(text);
        
        if (rows.length < 2) throw new Error('Empty CSV');
        
        const header = rows[0];
        const countryIndex = header.indexOf('CSV Countries');
        const idx = countryIndex !== -1 ? countryIndex : 0;
        
        const countries = rows.slice(1).map(r => r[idx]).filter(c => c && c.trim() !== '');
        allCountries = Array.from(new Set(countries)).sort();
        
        renderCountryList(allCountries);
    } catch (e) {
        console.error('❌ Country fetch failed:', e);
        const fallback = ['Japan', 'South Korea', 'USA', 'UK', 'France', 'Germany', 'Italy', 'Spain', 'Australia', 'Canada'];
        allCountries = fallback;
        renderCountryList(allCountries);
    }
}

function renderCountryList(countries) {
    const list = document.getElementById('countryList');
    list.innerHTML = countries.map(c => `
        <label class="country-item">
            <input type="checkbox" value="${c}" onchange="updateSelection()"> ${c}
        </label>
    `).join('');
    
    const display = document.getElementById('selectorDisplay');
    display.querySelector('span:first-child').textContent = 'Select countries...';
}

function toggleDropdown() {
    const d = document.getElementById('selectorDropdown');
    d.style.display = d.style.display === 'block' ? 'none' : 'block';
    if (d.style.display === 'block') document.getElementById('countrySearch').focus();
}

function filterCountries() {
    const q = document.getElementById('countrySearch').value.toLowerCase();
    document.querySelectorAll('.country-item').forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(q) ? 'flex' : 'none';
    });
}

function updateSelection() {
    selectedCountries = Array.from(document.querySelectorAll('#countryList input:checked')).map(cb => cb.value);
    const display = document.getElementById('selectorDisplay');
    const firstSpan = display.querySelector('span:first-child');
    
    if (selectedCountries.length === 0) firstSpan.textContent = 'Select countries...';
    else if (selectedCountries.length === 1) firstSpan.textContent = selectedCountries[0];
    else firstSpan.textContent = `${selectedCountries.length} countries selected`;
}

// ==========================================
// PRODUCT FETCHING & FILTERING
// ==========================================
async function fetchAllProducts() {
    try {
        const res = await fetch(PRODUCTS_CSV_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        const rows = parseCSV(text);
        
        if (rows.length < 2) return [];
        
        const headers = rows[0];
        return rows.slice(1).map(row => {
            let obj = {};
            headers.forEach((h, i) => { obj[h] = row[i] || ''; });
            return obj;
        });
    } catch (e) {
        console.error('❌ Product fetch failed:', e);
        return [];
    }
}

async function findPlans() {
    if (selectedCountries.length === 0) {
        alert('Please select at least one country.');
        return;
    }
    
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('resultsSection').style.display = 'block';
    document.getElementById('loadingState').style.display = 'block';
    document.getElementById('productGrid').innerHTML = '';
    document.getElementById('errorState').style.display = 'none';
    document.getElementById('noResultsState').style.display = 'none';
    document.getElementById('comparisonSection').style.display = 'none';
    
    if (allPlans.length === 0) {
        allPlans = await fetchAllProducts();
    }
    
    if (allPlans.length === 0) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('errorState').innerHTML = '<p>⚠️ Failed to load products. Please try again.</p>';
        document.getElementById('errorState').style.display = 'block';
        return;
    }
    
    // Filter locally: Check if any selected country is in the plan's coverage
    cachedPlans = allPlans.filter(plan => {
        const covered = plan['API locationName'] ? plan['API locationName'].split(',').map(c => c.trim()) : [];
        return selectedCountries.some(c => covered.includes(c));
    });
    
    filteredPlans = cachedPlans;
    sortPlans(filteredPlans);
    
    document.getElementById('loadingState').style.display = 'none';
    if (filteredPlans.length === 0) {
        document.getElementById('noResultsState').style.display = 'block';
    } else {
        renderProductGrid(filteredPlans);
    }
}

// ==========================================
// SORTING & PLAN TYPE LOGIC
// ==========================================
function getPlanType(plan) {
    const code = (plan['CSV Code'] || '').toUpperCase();
    // TODO: Update these keywords if your CSV Code values are different (e.g., 'GL', 'RE')
    if (code.includes('GLOBAL')) return 'global';
    if (code.includes('REGIONAL')) return 'regional';
    
    // Fallback based on country count
    const codes = plan['CSV Country Codes'] ? plan['CSV Country Codes'].split(',') : [];
    if (codes.length > 10) return 'global';
    if (codes.length > 1) return 'regional';
    return 'local';
}

function sortPlans(plans) {
    plans.sort((a, b) => {
        const aType = getPlanType(a);
        const bType = getPlanType(b);
        if (aType === 'global' && bType !== 'global') return -1;
        if (aType !== 'global' && bType === 'global') return 1;
        
        const aCodes = a['CSV Country Codes'] ? a['CSV Country Codes'].split(',') : [];
        const bCodes = b['CSV Country Codes'] ? b['CSV Country Codes'].split(',') : [];
        if (aCodes.length !== bCodes.length) return aCodes.length - bCodes.length;
        
        const aSlug = (a['API slug'] || '').substring(0, 3).toLowerCase();
        const bSlug = (b['API slug'] || '').substring(0, 3).toLowerCase();
        if (aSlug !== bSlug) return aSlug.localeCompare(bSlug);
        
        const aDur = parseInt(a['API duration']) || 0;
        const bDur = parseInt(b['API duration']) || 0;
        if (aDur !== bDur) return aDur - bDur;
        
        const aGB = parseFloat(a['CSV GBs_Binary']) || 0;
        const bGB = parseFloat(b['CSV GBs_Binary']) || 0;
        if (aGB !== bGB) return aGB - bGB;
        
        const aPrice = parseFloat(a['DSIM_rawUSD']) || 0;
        const bPrice = parseFloat(b['DSIM_rawUSD']) || 0;
        return aPrice - bPrice;
    });
}

function handlePlanTypeChange(changedId) {
    const globalInclude = document.getElementById('globalInclude');
    const globalExclude = document.getElementById('globalExclude');
    const regionalInclude = document.getElementById('regionalInclude');
    const regionalExclude = document.getElementById('regionalExclude');

    if (changedId === 'globalInclude' && globalInclude.checked) globalExclude.checked = false;
    else if (changedId === 'globalExclude' && globalExclude.checked) globalInclude.checked = false;
    
    if (changedId === 'regionalInclude' && regionalInclude.checked) regionalExclude.checked = false;
    else if (changedId === 'regionalExclude' && regionalExclude.checked) regionalInclude.checked = false;
}

function applyFilters() {
    if (cachedPlans.length === 0) return;
    
    const minData = parseFloat(document.getElementById('minData').value) || 0;
    const maxData = parseFloat(document.getElementById('maxData').value) || Infinity;
    const minDuration = parseFloat(document.getElementById('minDuration').value) || 0;
    const maxDuration = parseFloat(document.getElementById('maxDuration').value) || Infinity;
    
    const globalInclude = document.getElementById('globalInclude').checked;
    const globalExclude = document.getElementById('globalExclude').checked;
    const regionalInclude = document.getElementById('regionalInclude').checked;
    const regionalExclude = document.getElementById('regionalExclude').checked;
    
    filteredPlans = cachedPlans.filter(plan => {
        const gb = parseFloat(plan['CSV GBs_Binary']) || 0;
        if (gb < minData || gb > maxData) return false;
        
        const dur = parseInt(plan['API duration']) || 0;
        if (dur < minDuration || dur > maxDuration) return false;
        
        const planType = getPlanType(plan);
        if (globalInclude && planType !== 'global') return false;
        if (globalExclude && planType === 'global') return false;
        if (regionalInclude && planType !== 'regional') return false;
        if (regionalExclude && planType === 'regional') return false;
        
        return true;
    });
    
    sortPlans(filteredPlans);
    renderProductGrid(filteredPlans);
}

// ==========================================
// OPERATOR PARSING
// ==========================================
function parseOperators(operatorsStr) {
    if (!operatorsStr) return [];
    return operatorsStr.split(';').map(op => {
        op = op.trim();
        if (!op) return null;
        const match = op.match(/^([A-Z]{2})\s*-\s*(.*)$/i);
        if (match) {
            const code = match[1].toUpperCase();
            const rest = match[2].trim();
            const typeMatch = rest.match(/\s+(3G|4G|5G|LTE)$/i);
            let type = 'N/A';
            let name = rest;
            if (typeMatch) {
                type = typeMatch[1].toUpperCase();
                name = rest.substring(0, typeMatch.index).trim();
            }
            return { code, name, type };
        }
        return { code: '', name: op, type: 'N/A' };
    }).filter(Boolean);
}

// ==========================================
// RENDERING UI
// ==========================================
function renderProductGrid(plans) {
    const grid = document.getElementById('productGrid');
    if (plans.length === 0) {
        grid.innerHTML = '';
        document.getElementById('noResultsState').style.display = 'block';
        return;
    }
    document.getElementById('noResultsState').style.display = 'none';
    
    grid.innerHTML = plans.map((plan, index) => {
        const planType = getPlanType(plan);
        const planTypeBadge = planType === 'global' ? '<span class="badge badge-global">Global</span>' :
                              planType === 'regional' ? '<span class="badge badge-regional">Regional</span>' :
                              '<span class="badge badge-local">Local</span>';
        
        const gb = parseFloat(plan['CSV GBs_Binary']) || 0;
        const dataDisplay = gb === 0 ? 'N/A' : `${gb} GB`;
        
        const category = plan['CSV Plan Category'] || 'Full Speed';
        const duration = plan['API duration'] || 'N/A';
        
        const priceCents = parseFloat(plan['DSIM_rawUSD']) || 0;
        const price = priceCents / 100;
        const pricePerGB = gb === 0 ? 'N/A' : `$${(price / gb).toFixed(2)}`;
        
        const covered = plan['API locationName'] ? plan['API locationName'].split(',').map(c => c.trim()) : [];
        const countryCount = covered.length;
        
        const slug = plan['API slug'] || '';
        const packageCode = plan['API packageCode'] || '';
        const identifier = packageCode || slug;
        
        const isCompared = comparedProducts.some(p => (p['API packageCode'] || p['API slug']) === identifier);
        
        const operators = parseOperators(plan['CSV Operators']);
        const operatorsJson = encodeURIComponent(JSON.stringify(operators));
        
        const codes = plan['CSV Country Codes'] ? plan['CSV Country Codes'].split(',').map(c => c.trim()) : [];
        const countryMap = {};
        covered.forEach((name, i) => { if (codes[i]) countryMap[name] = codes[i]; });
        const countryMapJson = encodeURIComponent(JSON.stringify(countryMap));

        return `
        <div class="product-card" data-slug="${slug}" data-package="${packageCode}">
            <div class="product-header">
                <div class="product-name">${plan['API name'] || 'Unknown Plan'} ${planTypeBadge}</div>
                <div class="product-price">$${price.toFixed(2)}</div>
            </div>
            <div class="product-body">
                <div class="product-specs">
                    <div class="spec-item"><span class="spec-label">Data</span><span class="spec-value">${dataDisplay}</span></div>
                    <div class="spec-item"><span class="spec-label">Speed / Type</span><span class="spec-value">${category}</span></div>
                    <div class="spec-item"><span class="spec-label">Duration</span><span class="spec-value">${duration} Days</span></div>
                    <div class="spec-item"><span class="spec-label">Price/GB</span><span class="spec-value">${pricePerGB}</span></div>
                    <div class="spec-item"><span class="spec-label">Coverage</span><span class="spec-value">${countryCount} ${countryCount === 1 ? 'Country' : 'Countries'}</span></div>
                </div>
            </div>
            <div class="compare-checkbox">
                <label>
                    <input type="checkbox" onchange="toggleCompare('${identifier}', ${index})" ${isCompared ? 'checked' : ''}>
                    Add to Compare
                </label>
            </div>
            <div class="product-actions">
                <button class="secondary" onclick="toggleMoreInfo(this)">ℹ️ More Info</button>
                <button class="success" onclick="initiateCheckout('${identifier}')">💳 Buy Now</button>
            </div>
            <div class="more-info-section">
                <div class="info-grid">
                    <div class="spec-item"><span class="spec-label">Package Code</span><span class="spec-value">${packageCode || 'N/A'}</span></div>
                    <div class="spec-item"><span class="spec-label">IP Export</span><span class="spec-value">${plan['API ipExport'] || 'N/A'}</span></div>
                    <div class="spec-item"><span class="spec-label">Active Type</span><span class="spec-value">${plan['API activeType'] || 'N/A'}</span></div>
                    <div class="spec-item"><span class="spec-label">SMS Status</span><span class="spec-value">${plan['API smsStatus'] || 'N/A'}</span></div>
                    <div class="spec-item"><span class="spec-label">Top-Up Support</span><span class="spec-value">${plan['API supportTopUpType'] || 'N/A'}</span></div>
                    <div class="spec-item"><span class="spec-label">Unused Valid Time</span><span class="spec-value">${plan['API unusedValidTime'] || 'N/A'}</span></div>
                </div>
                <div class="coverage-section">
                    <div class="coverage-header" onclick="toggleCoverageList(this)">
                        <span>🌍 Coverage & Networks</span>
                        <span class="coverage-count">(${countryCount} countries - Click to toggle)</span>
                    </div>
                    <div class="coverage-list" style="display: none;">
                        ${covered.length > 0 ? covered.map(name => {
                            return `<span class="coverage-item" onclick="showOperatorPopup('${name.replace(/'/g, "\\'")}', '${operatorsJson}', '${countryMapJson}')">${name}</span>`;
                        }).join('') : '<span>No coverage info available</span>'}
                    </div>
                </div>
            </div>
        </div>
        `;
    }).join('');
}

function toggleMoreInfo(button) {
    const card = button.closest('.product-card');
    const moreInfo = card.querySelector('.more-info-section');
    const isExpanded = moreInfo.classList.contains('expanded');
    moreInfo.classList.toggle('expanded');
    button.textContent = isExpanded ? 'ℹ️ More Info' : '🔼 Less Info';
}

function toggleCoverageList(header) {
    const list = header.nextElementSibling;
    list.style.display = list.style.display === 'none' ? 'flex' : 'none';
}

function showOperatorPopup(countryName, operatorsJson, countryMapJson) {
    const operators = JSON.parse(decodeURIComponent(operatorsJson));
    const countryMap = JSON.parse(decodeURIComponent(countryMapJson));
    
    const popup = document.getElementById('operatorPopup');
    const overlay = document.getElementById('popupOverlay');
    const title = document.getElementById('popupCountryName');
    const list = document.getElementById('operatorList');
    
    title.textContent = `${countryName} - Network Operators`;
    
    const countryCode = countryMap[countryName];
    let filteredOps = operators;
    if (countryCode) {
        filteredOps = operators.filter(op => op.code === countryCode);
    }
    
    if (filteredOps.length === 0) {
        list.innerHTML = '<p style="color: #64748b;">No operator information available for this country.</p>';
    } else {
        list.innerHTML = filteredOps.map(op => `
            <div class="operator-item">
                <span class="operator-name">${op.name}</span>
                <span class="operator-type">${op.type}</span>
            </div>
        `).join('');
    }
    
    popup.classList.add('active');
    overlay.classList.add('active');
}

function closeOperatorPopup() {
    document.getElementById('operatorPopup').classList.remove('active');
    document.getElementById('popupOverlay').classList.remove('active');
}

// ==========================================
// COMPARISON LOGIC
// ==========================================
function toggleCompare(identifier, index) {
    const plan = filteredPlans[index];
    const existingIndex = comparedProducts.findIndex(p => 
        (p['API packageCode'] || p['API slug']) === identifier
    );
    
    if (existingIndex >= 0) {
        comparedProducts.splice(existingIndex, 1);
    } else {
        comparedProducts.push(plan);
    }
    
    const comparisonSection = document.getElementById('comparisonSection');
    const compareCount = document.getElementById('compareCount');
    
    if (comparedProducts.length >= 2) {
        comparisonSection.style.display = 'block';
        compareCount.textContent = comparedProducts.length;
        renderComparisonTable();
    } else {
        comparisonSection.style.display = 'none';
        comparedProducts = [];
    }
}

function clearComparison() {
    comparedProducts = [];
    document.getElementById('comparisonSection').style.display = 'none';
    document.querySelectorAll('.compare-checkbox input[type="checkbox"]').forEach(cb => { cb.checked = false; });
    renderProductGrid(filteredPlans);
}

function renderComparisonTable() {
    const container = document.getElementById('comparisonTableContainer');
    if (comparedProducts.length < 2) { container.innerHTML = ''; return; }
    
    let html = '<table class="comparison-table"><thead><tr><th>Feature</th>';
    comparedProducts.forEach(plan => { html += `<th>${plan['API name'] || 'Unknown'}</th>`; });
    html += '</tr></thead><tbody>';
    
    const rows = [
        { label: 'Price', getValue: p => `$${(parseFloat(p['DSIM_rawUSD']) / 100 || 0).toFixed(2)}` },
        { label: 'Data Allowance', getValue: p => `${parseFloat(p['CSV GBs_Binary']) || 0} GB` },
        { label: 'Duration', getValue: p => `${p['API duration'] || 'N/A'} Days` },
        { label: 'Speed / Type', getValue: p => p['CSV Plan Category'] || 'N/A' },
        { label: 'Price/GB', getValue: p => {
            const gb = parseFloat(p['CSV GBs_Binary']) || 0;
            const price = parseFloat(p['DSIM_rawUSD']) / 100 || 0;
            if (gb === 0) return 'N/A';
            return `$${(price / gb).toFixed(2)}`;
        }},
        { label: 'Countries Covered', getValue: p => p['API locationName'] ? p['API locationName'].split(',').length : 0 },
        { label: 'Package Code', getValue: p => p['API packageCode'] || 'N/A' },
        { label: 'IP Export', getValue: p => p['API ipExport'] || 'N/A' },
        { label: 'Active Type', getValue: p => p['API activeType'] || 'N/A' },
        { label: 'SMS Status', getValue: p => p['API smsStatus'] || 'N/A' },
        { label: 'Top-Up Support', getValue: p => p['API supportTopUpType'] || 'N/A' },
        { label: 'Plan Type', getValue: p => {
            const type = getPlanType(p);
            return type.charAt(0).toUpperCase() + type.slice(1);
        }}
    ];
    
    rows.forEach(row => {
        html += `<tr><td><strong>${row.label}</strong></td>`;
        comparedProducts.forEach(plan => { html += `<td>${row.getValue(plan)}</td>`; });
        html += '</tr>';
    });
    
    html += '</tbody></table>';
    container.innerHTML = html;
}

// ==========================================
// CHECKOUT (ACTIVEPIECES WEBHOOK)
// ==========================================
async function initiateCheckout(planIdentifier) {
    const plan = cachedPlans.find(p => 
        (p['API packageCode'] || '') === planIdentifier || 
        (p['API slug'] || '') === planIdentifier
    );
    
    if (!plan) {
        alert('Plan not found. Please try again.');
        return;
    }
    
    const payload = {
        packageCode: plan['API packageCode'],
        name: plan['API name'],
        price: parseFloat(plan['DSIM_rawUSD']) || 0, // Send cents to Stripe
        duration: plan['API duration'],
        data: plan['CSV GBs_Binary'],
        slug: plan['API slug']
    };
    
    try {
        const response = await fetch(APC_CHECKOUT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        
        const data = await response.json();
        
        // Assuming ActivePieces returns a Stripe Checkout URL in the response
        if (data.checkoutUrl) {
            window.location.href = data.checkoutUrl;
        } else {
            alert('Checkout initiated. Check console for response.');
            console.log('ActivePieces Response:', data);
        }
    } catch (e) {
        console.error('Checkout failed:', e);
        alert('Failed to initiate checkout. Please try again.');
    }
}
